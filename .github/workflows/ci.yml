name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    # increment 2 spec, "CI timing": raised from increment 1's 10 minutes -
    # the godot-cpp compile alone measured ~5 minutes on a cold cache.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential git curl unzip

      # increment 2 spec, "CI timing": build caching is required at this
      # increment's scale, not merely permitted as in increment 1 - without
      # it every push repays the full godot-cpp/JSBSim compile.
      - name: Cache CMake build directory
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-cmake-build-${{ hashFiles('CMakeLists.txt') }}

      - name: Cache Godot editor binary
        uses: actions/cache@v4
        with:
          path: .godot-tools
          key: ${{ runner.os }}-godot-bin-${{ hashFiles('scripts/run_tests.sh') }}

      # increment 3 spec, "Test runner and CI": run_tests.sh now also
      # drives the networked phase (physics preservation, transport
      # fidelity, input path, protocol, resilience via net_relay). No new
      # system dependencies or CI configuration changed - ENet is
      # self-contained C fetched by CMake, and net_relay uses only
      # standard POSIX sockets already available on this runner image;
      # the added phase measured well within the existing 20-minute
      # budget.
      #
      # increment 4 spec, "Acceptance criteria" #6: adds six more
      # networked test invocations (~8s wall-clock duration each plus
      # ~1.5s server/relay startup) - well under a minute of added time,
      # confirmed to remain inside the existing 20-minute budget rather
      # than requiring it to be raised.
      #
      # increment 5 spec, "Acceptance criteria" #8: adds interpcore_tests
      # and the MTU regression check (both near-instant, synthetic data
      # only) plus 5 more short networked invocations (the multiclient
      # test, ~4s, and four chunking-boundary counts, ~4s each plus
      # ~1.5s server startup for --stress-aircraft) - on the order of 30s
      # added, confirmed to remain inside the existing 20-minute budget.
      - name: Run full test suite
        run: ./scripts/run_tests.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/
